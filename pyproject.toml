[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sive"
version = "1.0.0"
description = "SIVE (Scrap Ingest Vectorize Extends): documentation ingestion, vector indexing and MCP retrieval"
readme = "DEPLOYMENT.md"
requires-python = ">=3.14,<3.15"
authors = [
    {name = "Valentin JOURNET", email = "valentin.journet@talan.com"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "documentation", "vector-search", "rag", "chromadb", "web-scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "beautifulsoup4==4.15.0",
    "chromadb==1.5.9",
    "ddgs==9.16.1",
    "httpx==0.28.1",
    "json5==0.17.3",
    "lxml==6.1.3",
    "mcp==2.3.0",
    "openpyxl==3.1.5",
    "playwright==1.65.2",
    "pypdf==7.1.0",
    "python-docx==1.2.0",
    "sentence-transformers==6.3.0",
    "tomlkit==0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "black==26.10.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[project.urls]
Homepage = "https://github.com/vjournet-dev/SIVE"
Repository = "https://github.com/vjournet-dev/SIVE"
Issues = "https://github.com/vjournet-dev/SIVE/issues"
Documentation = "https://github.com/vjournet-dev/SIVE#readme"

[project.scripts]
sive = "sive.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
sive = [
    "domain/client_install/*.json",
    "domain/client_install/assets/**/*.png",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning:chromadb.telemetry.opentelemetry",
]

